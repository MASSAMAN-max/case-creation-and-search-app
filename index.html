<!DOCTYPE html>
<html>
<head>
<!-- PWA・メタデータ設定：プログレッシブウェブアプリ化、アイコン登録 -->
<link rel="manifest" href="/case-creation-and-search.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <!-- ベースURL設定：リンクを新タブで開かない -->
  <base target="_top">
  <!-- レスポンシブ対応とビューポート設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 外部フォント読み込み：日本語対応フォント（Plus Jakarta Sans, Roboto） -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <!-- Googleの Material Design アイコン読み込み -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- SweetAlert2：モーダルダイアログ・アラート用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
<!-- ログイン画面：初期表示（認証前） -->
<div id="loginScreen" class="login-container" style="display:none;">
  <div class="login-box">
    <h2 style="text-align:center; margin-bottom:32px;">案件管理アプリ ログイン</h2>
    
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <!-- ログインID入力欄 -->
      <div style="margin-bottom:20px;">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">ログインID</label>
        <!-- autocompleteを追加しておくとブラウザに親切です -->
        <input type="text" id="loginIdInput" style="width:100%;" placeholder="IDを入力してください" autocomplete="username" required>
      </div>
      <!-- パスワード入力欄：表示/非表示切り替え機能付き -->
      <div style="margin-bottom:32px; position:relative;">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">パスワード</label>
        <input type="password" id="loginPasswordInput" style="width:100%; padding-right:50px; box-sizing: border-box;" placeholder="パスワードを入力してください" autocomplete="current-password" required>
        <!-- パスワード表示・非表示切り替えアイコン -->
        <span onclick="togglePasswordVisibility()" style="position:absolute; right:12px; top:45px; cursor:pointer; color:var(--text-sub); user-select:none;">
          <span id="eyeIcon" class="material-symbols-outlined" style="font-size: 22px; vertical-align: middle;">visibility_off</span>
        </span>
      </div>
      <!-- ログインボタン -->
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; padding:14px; font-size:18px;">ログイン</button>
      
    </form>
  </div>
</div>
  
  <!-- 初期ローディング画面：ページ読み込み時の表示 -->
  <!-- ※JavaScriptで表示する際は、displayを 'flex' に切り替えてください -->
  <div id="initLoader" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #ffffff; z-index: 9999; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 120px;">
    <div style="width: 100%; max-width: 350px; text-align: center;">
      <!-- 波状のローディングアニメーション -->
      <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 24px; height: 50px;">
        <div style="width: 6px; height: 16px; background: linear-gradient(to bottom, #4a90e2, #9b59b6); border-radius: 4px; animation: geminiWave 1.2s ease-in-out infinite;"></div>
        <div style="width: 6px; height: 32px; background: linear-gradient(to bottom, #7bb0f9, #bdc3c7); border-radius: 4px; animation: geminiWave 1.2s ease-in-out infinite; animation-delay: 0.15s;"></div>
        <div style="width: 6px; height: 48px; background: linear-gradient(to bottom, #4a90e2, #4facfe); border-radius: 4px; animation: geminiWave 1.2s ease-in-out infinite; animation-delay: 0.3s;"></div>
        <div style="width: 6px; height: 24px; background: linear-gradient(to bottom, #9b59b6, #ff0844); border-radius: 4px; animation: geminiWave 1.2s ease-in-out infinite; animation-delay: 0.45s;"></div>
      </div>
      <!-- ローディングテキスト -->
      <p id="loaderText" style="margin: 0; color: #475569; font-size: 16px; font-weight: bold; letter-spacing: 0.5px; animation: pulseText 2s ease-in-out infinite;">
        読み込み中...
      </p>
    </div>
  </div>
  
  <!-- メインアプリ画面：認証後の表示 -->
  <div id="mainApp" style="display:none; padding: 12px;">

    <div style="display: flex; align-items: center; margin: 12px 12px 8px 12px;">
      <!-- ユーザー表示ラベル兼ログアウトボタン（右上）：
           通常は「👤ユーザー名」を表示し、ホバーすると「ログアウト」表示に切り替わる。
           クリック（タップ）すると、ホバーの有無に関わらずhandleLogout()の確認ダイアログが開く。 -->
      <button type="button" id="userLogoutLabel" class="user-logout-label" onclick="handleLogout()" style="display:none;" title="クリックでログアウト">
        <span class="material-symbols-outlined logout-icon">logout</span>
        <span id="userDisplayLabel" class="label-text-default"></span>
        <span class="label-text-hover">ログアウト</span>
      </button>
    </div>
      
    <!-- 検索・フィルターセクション -->
    <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 24px;">
      
      <!-- ヘッダー：タイトル・新規登録ボタン -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 12px; flex-wrap: wrap; gap: 12px;">
        <div style="font-size: 22px; font-weight: bold; color: #1e293b; display:flex; align-items:center; gap:8px;">
          <span class="material-symbols-outlined" style="color:var(--primary); font-size:34px;">assignment</span> 案件管理アプリ
        </div>
        <!-- 新規案件登録ボタン -->
        <button class="btn btn-success" onclick="openCreateModal()" style="font-size: 18px; padding: 14px 28px;">
          <span class="material-symbols-outlined">add_circle</span> 新規案件を登録
        </button>
      </div>
    
      <!-- フィルター・検索エリア（常時表示：発注元・キーワードのみ） -->
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
        
        <!-- フィルター1：発注元選択ドロップダウン -->
        <div style="flex: 1; min-width: 200px;">
          <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub);">発注元で絞り込み</label>
          <select id="filterClient" style="width: 100%; background-color: #fafafa;"><option value="">すべて</option></select>
        </div>
        
        <!-- フィルター3：キーワード検索入力欄 -->
        <div style="flex: 2; min-width: 250px;">
          <input type="text" id="searchValue" placeholder="キーワード検索（No、案件名、施主名・よみ、住所）" style="width: 100%;">
        </div>
        
        <!-- 検索・クリア・詳細検索ボタン -->
        <div style="display: flex; flex-wrap: wrap; gap: 6px; min-width: 300px; flex: 1;">
          <!-- 詳細検索の開閉ボタン（一番左）。開閉時の配色変更はtoggleAdvancedSearch()が担当 -->
          <button type="button" id="toggleAdvancedSearchBtn" class="btn" onclick="toggleAdvancedSearch()"
            style="flex: 0 0 auto; background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding: 13px 14px; font-size:16px;">
            <span class="material-symbols-outlined" id="advancedSearchIcon" style="transition: transform 0.2s;">tune</span> 詳細検索
          </button>
          <button id="searchBtn" class="btn btn-primary" onclick="search()" style="flex: 1 1 auto; padding: 13px 10px; font-size:16px;">
            <span class="material-symbols-outlined">search</span> 検索する
          </button>
          <button id="clearBtn" class="btn btn-secondary" onclick="clearSearchFilters()" style="flex: 1 1 auto; padding: 13px 10px; font-size:16px;">
            <span class="material-symbols-outlined">clear</span> クリア
          </button>
        </div>
      </div>

      <!-- 施工日未設定の案件のみ表示するチェックボックス：詳細検索を開かなくても常に使えるよう常時表示エリアに配置 -->
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 14px;">
        <input type="checkbox" id="filterUnscheduledOnly" onchange="handleUnscheduledOnlyChange()" style="width:16px; height:16px; cursor:pointer;">
        <label for="filterUnscheduledOnly" style="font-size: 0.85rem; color: var(--text-sub); cursor:pointer;">施工日未設定の案件のみ表示</label>
      </div>

      <!-- 詳細検索エリア（工事内容・工事担当者・担当者・施工日）：既定は非表示 -->
      <div id="advancedSearchArea" style="display:none; margin-top: 16px; padding-top: 16px; border-top: 2px solid #f0f2f5;">
        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">

          <!-- フィルター1-2：工事内容（複数選択可）。何も選択しない場合はすべて対象 -->
          <div style="flex: 1; min-width: 200px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub);">工事内容で絞り込み（複数選択可）</label>
            <div id="filterWorkContentContainer"></div>
          </div>

          <!-- フィルター1-3：工事担当者（複数選択可）。何も選択しない場合はすべて対象 -->
          <div style="flex: 1; min-width: 200px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub);">工事担当者で絞り込み（複数選択可）</label>
            <div id="filterWorkerContainer"></div>
          </div>

          <!-- フィルター1-4：担当者（複数選択可）。何も選択しない場合はすべて対象 -->
          <div style="flex: 1; min-width: 200px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub);">担当者で絞り込み（複数選択可）</label>
            <div id="filterManagerContainer"></div>
          </div>
          
          <!-- フィルター2：施工日の日付範囲選択 -->
          <div style="display: flex; flex-wrap: wrap; gap: 10px; flex: 2; min-width: 280px;">
            <div style="flex: 1; min-width: 130px;">
              <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub); font-size: 0.9rem;">施工日（開始）</label>
              <input type="date" id="filterStartDate" style="width: 100%; cursor: pointer;" onchange="handleStartDateChange()" onclick="this.showPicker?.()">
            </div>
            <div style="flex: 1; min-width: 130px;">
              <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub); font-size: 0.9rem;">施工日（終了）</label>
              <input type="date" id="filterEndDate" style="width: 100%; cursor: pointer;" onclick="this.showPicker?.()">
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 検索結果件数表示 -->
    <div id="searchCount" style="margin-bottom: 12px; font-weight: bold; font-size: 16px; padding-left: 4px;"></div>

    <!-- 検索結果ページ送りボタン（上部）：JavaScriptで動的生成 -->
    <div id="searchPagerTop"></div>
    
    <!-- 検索結果表示エリア：JavaScriptで動的生成 -->
    <div id="results"></div>
    
    <!-- 新規案件登録モーダル -->
    <div id="createModal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="padding: 0; display: flex; flex-direction: column; max-height: 90vh; overflow: hidden;">
        <!-- モーダルヘッダー（スクロールしても常に表示・押下できる固定ヘッダー） -->
        <div style="position: relative; flex-shrink: 0; padding: 24px 32px 14px 32px; border-bottom: 3px solid var(--success); border-radius: 16px 16px 0 0; background: white;">
          <h2 style="margin: 0; color: #1e293b; display:flex; align-items:center; gap:8px; padding-right: 40px;">
            <span class="material-symbols-outlined" style="color:var(--success); font-size:32px;">assignment_add</span> 新規案件の登録
          </h2>
          <!-- 右上✕ボタン：スクロール位置に関わらず常時押下可能 -->
          <button type="button" onclick="closeCreateModal()" aria-label="閉じる"
            style="position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: none;
                   background: #f1f5f9; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center;
                   transition: background 0.2s, color 0.2s;"
            onmouseover="this.style.background='#fee2e2'; this.style.color='#ef4444';"
            onmouseout="this.style.background='#f1f5f9'; this.style.color='#64748b';">
            <span class="material-symbols-outlined" style="font-size: 22px;">close</span>
          </button>
        </div>

        <!-- モーダル本体（このエリアのみスクロール） -->
        <div id="createModalBody" style="overflow-y: auto; padding: 24px 32px 32px 32px; flex: 1;">
        <!-- 新規案件登録フォーム -->
        <form id="createProjectForm" onsubmit="handleCreateSubmit(event)">
    
          <!-- セクション1：基本情報（受注媒体・案件種別）※画面幅に関わらず常に横並び -->
          <div class="form-row-2col">
            <!-- 受注媒体選択：ドロップダウンまたは新規入力 -->
            <div class="form-group">
              <label>受注媒体 <span class="badge-required">必須</span></label>
              <select name="受注媒体" id="addMediaSelect" required style="width: 100%;" onchange="toggleNewInput(this, 'newMediaInputGroup')"></select>
              <div id="newMediaInputGroup" style="display: none; margin-top: 3px;">
                <input type="text" id="newMediaInput" placeholder="新規受注媒体名を入力してください" style="width: 100%;">
              </div>
            </div>
        
            <!-- 案件種別選択：ドロップダウンまたは新規入力 -->
            <div class="form-group">
              <label>案件種別 <span class="badge-required">必須</span></label>
              <select name="案件種別" id="addProjectTypeSelect" required style="width: 100%;" onchange="toggleNewInput(this, 'newProjectTypeInputGroup')"></select>
              <div id="newProjectTypeInputGroup" style="display: none; margin-top: 3px;">
                <input type="text" id="newProjectTypeInput" placeholder="新規案件種別名を入力してください" style="width: 100%;">
              </div>
            </div>
          </div>
    
          <!-- 発注元・案件名 ※PCでは横並び（発注元1:案件名2）、スマホでは縦積み -->
          <div class="form-row-responsive">
            <!-- 発注元選択：ドロップダウンまたは新規入力 -->
            <div class="form-group col-1">
              <label>発注元 <span class="badge-required">必須</span></label>
              <select name="発注元" id="addClientSelect" required style="width:100%;" onchange="toggleNewInput(this, 'newClientInputGroup'); updateManagersByClient(this.value, 'addStaffSelect');"></select>
              <div id="newClientInputGroup" style="display: none; margin-top: 8px;">
                <input type="text" id="newClientInput" placeholder="新規発注元名を入力してください" style="width: 100%;">
              </div>
            </div>
    
            <!-- 案件名入力欄 -->
            <div class="form-group col-2">
              <label>案件名 <span class="badge-required">必須</span></label>
              <div class="voice-input-wrapper">
                <input type="text" id="project_name" name="案件名" placeholder="例：〇〇様邸新築工事" required>
                <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                  <span class="material-symbols-outlined">mic</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 施主名入力欄（よみは任意入力。未入力なら保存時に自動生成される） -->
          <div class="form-row-2col">
            <div class="form-group">
              <label><span class="material-symbols-outlined">badge</span> 施主名</label>
              <div class="voice-input-wrapper">
                <input type="text" id="client_name" name="施主名" placeholder="例：山田太郎">
                <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                  <span class="material-symbols-outlined">mic</span>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label><span class="material-symbols-outlined">badge</span> 施主名よみ（任意）</label>
              <input type="text" id="client_name_yomi" name="施主名よみ" placeholder="未入力の場合は自動生成されます">
            </div>
          </div>

          <!-- セクション3：物件情報 -->
          <!-- 現場住所 -->
          <div class="form-group">
            <label><span class="material-symbols-outlined">home</span> 現場住所</label>
            <div class="voice-input-wrapper">
              <input type="text" id="address" name="現場住所" placeholder="例：〒937-0061 富山県魚津市仏田３４６１−２">
              <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                <span class="material-symbols-outlined">mic</span>
              </button>
            </div>
          </div>
    
          <!-- 現場緯度経度（地図連携用） -->
          <div class="form-group">
            <label><span class="material-symbols-outlined">pin_drop</span> 現場緯度経度</label>
            <input type="text" id="Latitude_longitude" name="現場緯度経度" placeholder="例：36.8420,137.4060" style="width: 100%;">
          </div>

          <!-- 駐車場情報：普段は折りたたんでおき、必要な案件だけ開いて入力する -->
          <div class="inner-accordion" style="margin-top:16px; margin-bottom:20px; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden;">
            <div class="inner-accordion-summary" onclick="toggleInnerAccordion(this)" style="cursor:pointer; background:#e2e8f0; padding:12px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#334155;">
              <span style="display:flex; align-items:center; gap:6px;"><span class="material-symbols-outlined" style="font-size:18px;">local_parking</span> 駐車場情報</span>
              <span class="material-symbols-outlined inner-expand-icon" style="transition:transform 0.2s;">expand_more</span>
            </div>
            <div class="inner-accordion-details" style="display:none; padding:16px; background:#f8fafc; border-top:1px solid #cbd5e1;">
              <div class="form-group" style="margin-bottom:14px;">
                <label><span class="material-symbols-outlined">local_parking</span> 駐車場住所</label>
                <div class="voice-input-wrapper">
                  <input type="text" id="parking_address" name="駐車場住所" placeholder="例：現場近くのコインパーキング名など">
                  <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                    <span class="material-symbols-outlined">mic</span>
                  </button>
                </div>
              </div>
              <div class="form-group" style="margin:0;">
                <label><span class="material-symbols-outlined">pin_drop</span> 駐車場緯度経度</label>
                <input type="text" id="parking_latlng" name="駐車場緯度経度" placeholder="例：36.8420,137.4060" style="width: 100%;">
              </div>
            </div>
          </div>
    
          <!-- 延床面積・キーBOX ※画面幅に関わらず常に横並び -->
          <div class="form-row-2col">
            <div class="form-group">
              <label><span class="material-symbols-outlined">square_foot</span> 延床面積</label>
              <input type="text" id="room_area" name="延床面積" placeholder="例：85㎡" style="width: 100%;">
            </div>

            <!-- キーBOX（暗証番号・保管場所） -->
            <div class="form-group">
              <label><span class="material-symbols-outlined">key</span> キーBOX</label>
              <input type="text" id="key_box" name="キーBOX" placeholder="キーBOXの暗証番号や保管場所" style="width: 100%;">
            </div>
          </div>
    
          <!-- セクション4：担当者情報 ※画面幅に関わらず常に横並び -->
          <div class="form-row-2col">
            <!-- 担当者選択：ドロップダウンまたは新規入力 -->
            <div class="form-group">
              <label><span class="material-symbols-outlined">person</span> 担当者</label>
              <select name="担当者" id="addStaffSelect" style="width:100%;" onchange="handleStaffChange(this, 'addPhoneInput', 'newStaffInputGroup')"></select>
              <div id="newStaffInputGroup" style="display: none; margin-top: 8px;">
                <input type="text" id="newStaffInput" placeholder="新規担当者名を入力してください" style="width: 100%;">
              </div>
            </div>
    
            <!-- 連絡先（担当者選択時に自動入力） -->
            <div class="form-group">
              <label><span class="material-symbols-outlined">phone</span> 連絡先</label>
              <input type="text" name="連絡先" id="addPhoneInput" placeholder="担当者を選択すると自動反映されます" style="width: 100%;">
            </div>
          </div>
    
          <!-- 備考欄 -->
          <div class="form-group">
            <label><span class="material-symbols-outlined">notes</span> 備 考</label>
            <div class="voice-input-wrapper">
              <textarea name="備考" id="remarks" rows="2" placeholder="特記事項があれば入力してください" style="width: 100%; box-sizing: border-box;"></textarea>
              <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                <span class="material-symbols-outlined">mic</span>
              </button>
            </div>
          </div>
          
          <!-- 工事予定・担当割当（備考の下に配置）。中身は openCreateModal() が 07_record_form.js の関数で生成する -->
          <div id="createWorkSetsPanel"></div>

          <!-- セクション5：検査日時指定（日付＋時刻） -->
          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #334155; font-size: 14px;">検査日（時刻指定）</label>
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
              <!-- ★style属性の重複を1つに統合 -->
              <input type="date" id="newInspectionDate" name="検査日" placeholder="日付を選択" style="width: 100%; cursor: pointer;" onclick="this.showPicker?.()">
              <select id="newInspectionHour" onchange="handleInspectionHourChange(this, 'newInspectionMinute')" style="padding: 10px; border: 1px solid #adb5bd; border-radius: 6px; box-sizing: border-box;">
                <option value="">時</option>
              </select>
              <select id="newInspectionMinute" style="padding: 10px; border: 1px solid #adb5bd; border-radius: 6px; box-sizing: border-box;">
                <option value="">分</option>
              </select>
            </div>
          </div>
          
          <!-- セクション6：システム管理項目（ID・日付等） -->
          <div style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 20px; margin-top: 20px;">
            <h3 style="margin: 0 0 12px 0; font-size: 15px; color: #334155; font-weight: bold; display: flex; align-items: center; gap: 6px;">
              <span class="material-symbols-outlined" style="font-size: 24px; color: var(--text-sub);">admin_panel_settings</span> システム管理項目他
            </h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-group" style="margin:0;">
                <label>システムID</label>
                <input type="text" id="system_id" name="システムID" placeholder="システムID" style="width: 100%;">
              </div>
              <div class="form-group" style="margin:0;">
                <label>メールID</label>
                <input type="text" id="property_id" name="メールID" placeholder="メールID" style="width: 100%;">
              </div>
              <div class="form-group" style="margin:0;">
                <label>着工日</label>
                <!-- ★style属性の重複を1つに統合 -->
                <input type="date" id="construction_start_date" name="着工日" style="width: 100%; cursor: pointer;" onclick="this.showPicker?.()">
              </div>
              <div class="form-group" style="margin:0;">
                <label>完成日</label>
                <!-- ★style属性の重複を1つに統合 -->
                <input type="date" id="completion_date" name="完成日" style="width: 100%; cursor: pointer;" onclick="this.showPicker?.()">
              </div>
              <div class="form-group" style="margin:0; grid-column: span 2;">
                <label>引渡日</label>
                <!-- ★style属性の重複を1つに統合 -->
                <input type="date" id="delivery_date" name="引渡日" style="width: 100%; cursor: pointer;" onclick="this.showPicker?.()">
              </div>
            </div>
          </div>
    
          <!-- セクション7：ファイル添付 -->
          <div class="form-group">
            <label><span class="material-symbols-outlined">attach_file</span> 添付ファイル</label>
            <!-- ドラッグ&ドロップエリア -->
            <div class="uploadbox" id="createUploadBox" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleFileDrop(event, 'NEW_PROJECT')">
              <div class="material-symbols-outlined cloud-icon" style="font-size:40px; color:var(--primary)">cloud_upload</div>
              <div class="drag-drop-text" style="font-weight:bold; margin-top:6px;">ファイルをここにドラッグ＆ドロップ</div>
              <div class="drag-drop-text" style="font-size:12px; color:var(--text-sub); margin-bottom:10px;">または</div>
              <!-- ファイル選択ボタン -->
              <button type="button" class="btn btn-secondary" onclick="document.getElementById('createFileInput').click()">ファイルを選択</button>
              <!-- 隠しファイル入力 -->
              <input type="file" id="createFileInput" multiple style="display:none;" onchange="handleFileSelect(event, 'NEW_PROJECT')">
              <!-- 選択済みファイル一覧表示エリア -->
              <div id="createFileList" style="margin-top: 10px;"></div>
            </div>
          </div>
            
          <!-- フォームフッター：登録ボタン（閉じるボタンは右上✕ボタンに統合したため廃止） -->
          <div style="display: flex; justify-content: flex-end; gap: 5px; margin-top: 30px;">
            <button type="submit" id="createSubmitBtn" class="btn btn-success" style="padding: 15px 21px;">
              <span class="material-symbols-outlined">save</span> この内容で登録する
            </button>
          </div>
        </form>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toastNotification" class="toast-box"></div>

  <!-- トップへ戻るボタン -->
  <button id="scrollToTopBtn" class="scrollToTopBtn" onclick="scrollToTop()">
    <span class="material-symbols-outlined" style="font-size: 24px;">arrow_upward</span>
  </button>
  
  <!-- アプリ本体のスクリプト（番号順に読み込む。順序を変えないこと） -->
  <script src="01_config.js"></script>
  <script src="02_utils.js"></script>
  <script src="03_api_auth.js"></script>
  <script src="04_form_parts.js"></script>
  <script src="05_search.js"></script>
  <script src="06_attachments.js"></script>
  <script src="07_record_form.js"></script>
</body>
</html>
